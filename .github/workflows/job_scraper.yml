name: 案件収集パイプライン（CrowdWorks）

# CrowdWorksはランナーのIPによって403で拒否されることがある（2026-10-07実測、
# 通るランナーと最初の1ページ目から拒否されるランナーがある）。拒否されたら
# 別のジョブ＝別のランナー（別IP）で最大5回までやり直す。拒否された回は
# 1ページ目で打ち切るので、1回あたり1分ほどしか使わない。
on:
  schedule:
    # JST 9:00, 17:00, 1:00 の1日3回実行（2026-08-27、GitHub Actionsの利用上限
    # 超過により全ワークフローが即失敗する事態が発生したため、6回/日→3回/日に削減）
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:   # 手動実行も可能

# 同時実行を防ぐ。定期実行と手動トリガーが重なると、双方が同じexisting_urls()を
# 見て同じ新着案件を「新規」と判定し、シートに重複追記してしまうバグが実際に発生した
# （2026-08-01、重複URL5件を発見）。cancel-in-progressはfalseにして、実行中の
# ジョブを打ち切らず、次の分はキューで待たせる。
concurrency:
  group: job-scraper-collect
  cancel-in-progress: false

jobs:
  try1:
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try2:
    needs: try1
    if: ${{ needs.try1.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try3:
    needs: try2
    if: ${{ needs.try2.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try4:
    needs: try3
    if: ${{ needs.try3.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try5:
    needs: try4
    if: ${{ needs.try4.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
