name: 案件収集パイプライン（CrowdWorks）

# CrowdWorksはランナーのIPによって403で拒否されることがある（2026-10-07実測、
# 通るランナーと最初の1ページ目から拒否されるランナーがある）。拒否されたら
# 別のジョブ＝別のランナー（別IP）で最大5回までやり直す。拒否された回は
# 1ページ目で打ち切るので、1回あたり1分ほどしか使わない。
on:
  schedule:
    # JST 8:07 / 13:07 / 19:07 の1日3回（依頼者が投稿しやすい朝・昼・夜）。
    # 2026-10-08、毎時0分は全世界の定期実行が集中してGitHub側で数時間遅れていた
    # （16:00 UTC予定が21:01開始）ため、0分を避けて7分にずらした。
    - cron: "7 23,4,10 * * *"
  workflow_dispatch:   # 手動実行も可能

# 同時実行を防ぐ。定期実行と手動トリガーが重なると、双方が同じexisting_urls()を
# 見て同じ新着案件を「新規」と判定し、シートに重複追記してしまうバグが実際に発生した
# （2026-08-01、重複URL5件を発見）。cancel-in-progressはfalseにして、実行中の
# ジョブを打ち切らず、次の分はキューで待たせる。
concurrency:
  group: job-scraper-collect
  cancel-in-progress: false

jobs:
  try1:
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try2:
    needs: try1
    if: ${{ needs.try1.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try3:
    needs: try2
    if: ${{ needs.try2.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try4:
    needs: try3
    if: ${{ needs.try3.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit
  try5:
    needs: try4
    if: ${{ needs.try4.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    secrets: inherit

  # 5回とも拒否された時だけ知らせる（その回の収集は無し、次の定期実行で再挑戦）
  notify_blocked:
    needs: try5
    if: ${{ needs.try5.outputs.blocked == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discordに通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" -A "Mozilla/5.0" \
            -d '{"content":"CrowdWorksに5回続けて拒否されたため、今回の案件収集はできませんでした。次の定期実行で自動的に再挑戦します。"}' \
            "$DISCORD_WEBHOOK_URL"
