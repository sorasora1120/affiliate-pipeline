name: 案件収集パイプライン（ココナラ）

# CrowdWorksはGitHub Actionsのクラウド共有IPから403 Forbiddenで拒否されるため、
# ここではココナラのみ実行する（CrowdWorksはローカルPCから実行: job_scraper/run_local_crowdworks.bat）
on:
  schedule:
    # JST 9:00, 13:00, 17:00, 21:00, 1:00, 5:00 の1日6回実行（2026-08-13、
    # 「早く案件もってこい」との要望を受けて4時間おきに増量。既存のREQUEST_INTERVAL_SECONDS
    # によるページ間の待機は変えていないため、1回あたりの負荷は変わらない）
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:   # 手動実行も可能

# 同時実行を防ぐ。定期実行と手動トリガーが重なると、双方が同じexisting_urls()を
# 見て同じ新着案件を「新規」と判定し、シートに重複追記してしまうバグが実際に発生した
# （2026-08-01、重複URL5件を発見）。cancel-in-progressはfalseにして、実行中の
# ジョブを打ち切らず、次の分はキューで待たせる。
concurrency:
  group: job-scraper-collect
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 2026-08-15、PAGES_PER_KEYWORD 2→5増量に合わせて緩和

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        working-directory: job_scraper
        run: pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      - name: 案件収集を実行
        working-directory: job_scraper
        env:
          PLATFORMS: coconala
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS || 'サイト制作,ホームページ制作,ECサイト構築,ECサイト制作,ネットショップ構築,ネットショップ,Shopify,コーポレートサイト制作,LP制作,ランディングページ制作,サイトリニューアル,Web制作,ホームページ作成,LP作成,ランディングページ作成,ネットショップ制作,WordPress制作,WordPress構築' }}
          MAX_JOBS_PER_KEYWORD: ${{ vars.MAX_JOBS_PER_KEYWORD || '30' }}
          PAGES_PER_KEYWORD: ${{ vars.PAGES_PER_KEYWORD || '5' }}
          REQUEST_INTERVAL_SECONDS: ${{ vars.REQUEST_INTERVAL_SECONDS || '3' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: デバッグ用スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-scraper-debug
          path: job_scraper/debug_*.png
          if-no-files-found: ignore
