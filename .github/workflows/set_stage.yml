name: 進み具合を付ける（URLで1行）

# 2026-10-10追加。ユーザーがビューアのボタンを押し忘れた進み具合（返信が来た・採用された等）を、相談で分かった時に
# Claude が付けるため（初めての返信が来たのに付いておらず、返信率が0%のままだった）。
# URL が一致する行の「進捗ステージ」（R列）だけを書き換える（set_stage.py）。
on:
  workflow_dispatch:
    inputs:
      url:
        description: "案件のURL（https://crowdworks.jp/public/jobs/...）"
        required: true
      stage:
        description: "applied / replied / hired / ordered / rejected"
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gspread google-auth
      - name: 付ける
        working-directory: job_scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JOB_URL: ${{ inputs.url }}
          STAGE: ${{ inputs.stage }}
        run: python set_stage.py
