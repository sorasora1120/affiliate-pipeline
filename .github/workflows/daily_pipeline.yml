name: 自動収益化パイプライン（毎日実行）

on:
  schedule:
    # JST 9:00 と 21:00 の1日2回実行
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:   # 手動実行も可能

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      # セルフバック自動申込は安全のため無効化（手動で確認してから申し込む）
      # - name: セルフバック自動申込

      - name: パイプラインを実行
        env:
          A8_USERNAME: ${{ secrets.A8_USERNAME }}
          A8_PASSWORD: ${{ secrets.A8_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_DOMAIN: ${{ secrets.HATENA_BLOG_DOMAIN }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_DRAFT: ${{ vars.HATENA_DRAFT || 'no' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MIN_REWARD_YEN: ${{ vars.MIN_REWARD_YEN || '0' }}
          MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '5' }}
          ARTICLE_INTERVAL_SECONDS: ${{ vars.ARTICLE_INTERVAL_SECONDS || '30' }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python main.py

      - name: デバッグ用スクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_*.png
          if-no-files-found: ignore

      - name: 失敗時に Discord へ通知（ジョブレベルの保険）
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \":red_circle: **[GitHub Actions]** パイプラインが失敗しました。\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
