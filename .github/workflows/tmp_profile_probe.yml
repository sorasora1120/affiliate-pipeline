name: 一時チェック（プロフィールと提案文）

# 2026-10-09、応募79件で返信0件のため、お客さんから見えるプロフィールの公開ページと、
# いま作っている提案文の実物を確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import json, urllib.parse, urllib.request
          from playwright.sync_api import sync_playwright
          out = []
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              pg = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", locale="ja-JP").new_page()
              pg.goto("https://crowdworks.jp/public/employees/6831717", wait_until="domcontentloaded", timeout=30000)
              pg.wait_for_timeout(4000)
              if "403" in (pg.title() or ""):
                  raise SystemExit("403（このランナーはブロックされている）")
              main = pg.locator("main").first if pg.locator("main").count() else pg.locator("body")
              text = " ".join(main.inner_text().split())
              imgs = pg.evaluate("() => [...document.querySelectorAll('img')].map(i => (i.alt || '') + '=' + (i.currentSrc || i.src).split('?')[0].slice(-60)).slice(0, 12)")
              out.append(f"プロフィールの題::{pg.title()}")
              for i in range(0, min(len(text), 6000), 1500):
                  out.append(f"プロフィール{i // 1500 + 1}::{text[i:i + 1500]}")
              out.append(f"プロフィールの画像::{' / '.join(imgs)}")
              b.close()
          sheet = "1i2BtQulkchFt2dXxt9o6qLhdC7CXlBpv91EziyCp3o0"
          q = urllib.parse.urlencode({"tqx": "out:json", "sheet": "案件一覧", "tq": "select C, P, E where A = '提案済み' and R = '' and Q >= '2026-10-09'"})
          t = urllib.request.urlopen(urllib.request.Request(f"https://docs.google.com/spreadsheets/d/{sheet}/gviz/tq?{q}", headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode()
          rows = json.loads(t[t.index("(") + 1:t.rindex(")")])["table"]["rows"]
          val = lambda c: "" if not c or c.get("v") is None else str(c["v"])
          for r in rows[-4:]:
              c = r.get("c") or []
              title, prop, budget = (val(c[0]), val(c[1]), val(c[2])) if len(c) >= 3 else ("", "", "")
              out.append(f"提案文（{len(prop)}字）::【{title[:40]}｜{budget}】" + prop.replace("\n", "⏎"))
          open("probe.txt", "w").write("\n".join(o.replace("\r", "") for o in out) + "\n")
          EOF
      - name: 結果
        working-directory: job_scraper
        run: while IFS= read -r line; do msg=${line#*::}; echo "::notice title=${line%%::*}::${msg//%/%25}"; done < probe.txt
