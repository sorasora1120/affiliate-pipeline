name: 成果のまとめ（1日1回）

# 2026-10-08追加。応募・返信・採用の数と、案件の種類・予算・応募者数ごとの返信率を出す。
# send_discord=1 なら Discord にまとめを送る。0 なら数字を GitHub の注釈に出すだけ（Claudeの定期チェック用）。
# 2026-10-10、schedule（JST 22:41）をやめた。GitHub側で5時間以上遅れて夜中の4時に届いていたため、
# Claudeの毎時の定期チェックが日本時間22時台に send_discord=1 で動かす。
on:
  workflow_dispatch:
    inputs:
      send_discord:
        description: "Discordにも送る（1で送る）"
        default: "0"

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv  # config.py（除外語）を読むため
      - name: 集計
        working-directory: job_scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
          SEND_DISCORD: ${{ inputs.send_discord }}
        run: python daily_stats.py
