name: 案件×ワーカー マッチング通知

# ココナラ収集（job_scraper.yml）の後に、未対応案件からワーカーへの
# 提案候補を抜き出し、依頼者情報を取得したうえでDiscordに通知する。
on:
  schedule:
    - cron: "30 0,4,9,13 * * *"
  workflow_dispatch:

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        working-directory: job_scraper
        run: pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      - name: マッチングを実行
        working-directory: job_scraper
        env:
          WORKER_MATCH_CATEGORIES: ${{ vars.WORKER_MATCH_CATEGORIES || 'サイト制作,ホームページ制作,ECサイト構築' }}
          WORKER_MATCH_EXCLUDE_KEYWORDS: ${{ vars.WORKER_MATCH_EXCLUDE_KEYWORDS || 'BASE,楽天市場,楽天,保守,運用サポート,営業' }}
          WORKER_MATCH_MIN_BUDGET_YEN: ${{ vars.WORKER_MATCH_MIN_BUDGET_YEN || '8000' }}
          WORKER_MATCH_MARGIN_PERCENT: ${{ vars.WORKER_MATCH_MARGIN_PERCENT || '20' }}
          WORKER_MATCH_MARGIN_MIN_YEN: ${{ vars.WORKER_MATCH_MARGIN_MIN_YEN || '3000' }}
          WORKER_MATCH_MARGIN_MAX_YEN: ${{ vars.WORKER_MATCH_MARGIN_MAX_YEN || '10000' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
        run: python worker_match_main.py
