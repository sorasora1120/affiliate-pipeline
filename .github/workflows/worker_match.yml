name: 案件×ワーカー マッチング通知

# ココナラ/CrowdWorks収集の後に、未対応案件からワーカーへの提案候補を抜き出し、
# Discordに通知する。依頼者情報は収集時（main.py、プラットフォームごとに正しい
# 実行元＝ローカル/クラウド）に取得済みのシート値を読むだけで、ここではライブ
# 取得しない（CrowdWorksはクラウドから直接アクセスできないため）。
on:
  schedule:
    # job_scraper.ymlの収集完了30分後（2026-08-13、収集を6回/日に増量したのに合わせて変更）
    - cron: "30 0,4,8,12,16,20 * * *"
  workflow_dispatch:

# 定期実行と手動トリガーの重なりを防ぐ（job_scraper.ymlと同じ理由）
concurrency:
  group: job-scraper-worker-match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    # 2026-08-11: 収集量を増やした結果、1回のマッチングで159件（Discord通知159×3=477通）
    # に達し、15分では通知の途中でタイムアウト・キャンセルされる事例が発生した。
    # 通知間隔の修正（src/notifier.py）と合わせて、余裕を持って40分に延長する。
    timeout-minutes: 40

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        working-directory: job_scraper
        run: pip install -r requirements.txt

      - name: マッチングを実行
        working-directory: job_scraper
        env:
          WORKER_MATCH_CATEGORIES: ${{ vars.WORKER_MATCH_CATEGORIES || 'サイト制作,ホームページ制作,ECサイト構築,ECサイト制作,ネットショップ構築,ネットショップ,Shopify,コーポレートサイト制作,LP制作,ランディングページ制作,サイトリニューアル,Web制作,ホームページ作成,LP作成,ランディングページ作成,ネットショップ制作,WordPress制作,WordPress構築,オンラインショップ制作,オンラインショップ構築' }}
          WORKER_MATCH_EXCLUDE_KEYWORDS: ${{ vars.WORKER_MATCH_EXCLUDE_KEYWORDS || 'BASE,楽天市場,楽天,保守,運用サポート,運営サポート,営業,ポスター,チラシ,名刺,バナー,パンフレット,冊子,ショップカード,動画,イラスト,漫画,マンガ,立ち絵,キャラクターデザイン,楽曲,音楽制作,撮影,画像加工,データ入力,商品リサーチ,創業メンバー,COO,ロゴ,バックオフィス,広告運用,戦略担当,セミナー,講座,カメラマン,CFO,資金繰り,管理会計,記事ライター,折衝経験,テレアポ,プレゼン資料,販促物,自動購入,出品アカウント,記事LP,ライター募集,新規顧客開拓,カスタマー対応,記帳代行,検索してくれる,お客様対応（窓口）,インスタ運用,Instagram運用,SNS運用,運用代行,クロージング担当,Canva,衣装,刺繍,ペンライト,教えるだけ,コンペ,アシスタントスタッフ,ディレクション業務,無料作成' }}
          WORKER_MATCH_MIN_BUDGET_YEN: ${{ vars.WORKER_MATCH_MIN_BUDGET_YEN || '40000' }}
          WORKER_MATCH_MARGIN_PERCENT: ${{ vars.WORKER_MATCH_MARGIN_PERCENT || '20' }}
          WORKER_MATCH_MARGIN_MIN_YEN: ${{ vars.WORKER_MATCH_MARGIN_MIN_YEN || '3000' }}
          WORKER_MATCH_MARGIN_MAX_YEN: ${{ vars.WORKER_MATCH_MARGIN_MAX_YEN || '30000' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
        run: python worker_match_main.py
