name: 案件×ワーカー マッチング通知

# ココナラ/CrowdWorks収集の後に、未対応案件からワーカーへの提案候補を抜き出し、
# Discordに通知する。依頼者情報は収集時（main.py、プラットフォームごとに正しい
# 実行元＝ローカル/クラウド）に取得済みのシート値を読むだけで、ここではライブ
# 取得しない（CrowdWorksはクラウドから直接アクセスできないため）。
on:
  schedule:
    - cron: "30 0,4,9,13 * * *"
  workflow_dispatch:

# 定期実行と手動トリガーの重なりを防ぐ（job_scraper.ymlと同じ理由）
concurrency:
  group: job-scraper-worker-match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        working-directory: job_scraper
        run: pip install -r requirements.txt

      - name: マッチングを実行
        working-directory: job_scraper
        env:
          WORKER_MATCH_CATEGORIES: ${{ vars.WORKER_MATCH_CATEGORIES || 'サイト制作,ホームページ制作,ECサイト構築,ECサイト制作,ネットショップ構築,ネットショップ,Shopify' }}
          WORKER_MATCH_EXCLUDE_KEYWORDS: ${{ vars.WORKER_MATCH_EXCLUDE_KEYWORDS || 'BASE,楽天市場,楽天,保守,運用サポート,営業,ポスター,チラシ,名刺,バナー,パンフレット,冊子,ショップカード,動画,イラスト,漫画,マンガ,立ち絵,キャラクターデザイン,楽曲,音楽制作,写真撮影,商品撮影,画像加工,データ入力,商品リサーチ,創業メンバー,COO,ロゴ' }}
          WORKER_MATCH_MIN_BUDGET_YEN: ${{ vars.WORKER_MATCH_MIN_BUDGET_YEN || '8000' }}
          WORKER_MATCH_MARGIN_PERCENT: ${{ vars.WORKER_MATCH_MARGIN_PERCENT || '20' }}
          WORKER_MATCH_MARGIN_MIN_YEN: ${{ vars.WORKER_MATCH_MARGIN_MIN_YEN || '3000' }}
          WORKER_MATCH_MARGIN_MAX_YEN: ${{ vars.WORKER_MATCH_MARGIN_MAX_YEN || '10000' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
        run: python worker_match_main.py
