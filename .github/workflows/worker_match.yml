name: 案件×ワーカー マッチング通知

# 案件収集の後に、未対応案件からワーカーへの提案候補を抜き出し、金額・提案文を
# 付けてDiscordに通知する。依頼者情報は収集時に取得済みのシート値を読むだけ。
on:
  # 2026-10-08、時刻指定（収集の30分後）をやめ、収集が終わったら直後に実行する。
  # 収集はCrowdWorksに拒否された時のやり直しやGitHub側の遅れで終わる時刻が
  # 読めず、収集前にマッチングが走って新着を次の回まで取りこぼすことがあったため。
  workflow_run:
    workflows: ["案件収集パイプライン（CrowdWorks）", "新着チェック（1時間ごと・CrowdWorks）"]
    types: [completed]
  # 2026-10-09、collect_ticker.yml がトークン（GITHUB_TOKEN）で起動した新着チェックの後は workflow_run が
  # 起きないため、新着チェックの最後の job から quiet=1 でこちらを起動する
  workflow_dispatch:
    inputs:
      quiet:
        description: "1 にすると「候補なし」を送らない（新着チェックの後から起動された時）"
        required: false
        default: "0"

# 定期実行と手動トリガーの重なりを防ぐ（job_scraper.ymlと同じ理由）
concurrency:
  group: job-scraper-worker-match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    # 2026-08-11: 収集量を増やした結果、1回のマッチングで159件（Discord通知159×3=477通）
    # に達し、15分では通知の途中でタイムアウト・キャンセルされる事例が発生した。
    # 通知間隔の修正（src/notifier.py）と合わせて、余裕を持って40分に延長する。
    timeout-minutes: 40

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        working-directory: job_scraper
        run: pip install -r requirements.txt

      - name: Playwright ブラウザをインストール
        run: playwright install chromium --with-deps

      - name: マッチングを実行
        working-directory: job_scraper
        env:
          # 2026-10-06、「もっと案件を増やしたい」との要望を受けてキーワードを拡張。
          # job_scraper.ymlのJOB_KEYWORDSおよびdispatch-viewer/index.htmlの
          # WORKER_MATCH_CATEGORIESと必ず同じ内容に揃えること（3箇所が食い違うと、
          # 収集はされるがビューアの「確認前」タブに出てこない、等の不整合が起きる）。
          # 2026-10-08、「案件が尽きないように」とのことで、修正・更新・コーディングなど小さく取りやすい
          # 仕事のキーワードを10個追加（27→37）。cw_collect_attempt.yml と dispatch-viewer にも同じものを足した
          WORKER_MATCH_CATEGORIES: ${{ vars.WORKER_MATCH_CATEGORIES || 'サイト制作,ホームページ制作,ECサイト構築,ECサイト制作,ネットショップ構築,ネットショップ,Shopify,コーポレートサイト制作,LP制作,ランディングページ制作,サイトリニューアル,Web制作,ホームページ作成,LP作成,ランディングページ作成,ネットショップ制作,WordPress制作,WordPress構築,STUDIO制作,ペライチ制作,Wix制作,ホームページ改修,ホームページリニューアル,コーポレートサイト作成,採用サイト制作,オウンドメディア構築,ネットショップ開設,ホームページ修正,WordPress修正,サイト修正,LP修正,Shopifyカスタマイズ,ホームページ更新,HTMLコーディング,LPコーディング,レスポンシブ対応,Webデザイン,ECサイト,LPデザイン,STUDIO,サイト構築,サイトデザイン,トップページ' }}
          # 2026-10-06追加: 「HIPHOP用ビート制作依頼」「ぬいぐるみ制作依頼」等、
          # ココナラの「サイト制作」検索結果に無関係な案件が紛れて通知されたのを
          # 実際に発見（ビート制作,ぬいぐるみを追加）。dispatch-viewer/index.htmlの
          # WORKER_MATCH_EXCLUDE_KEYWORDSと必ず同じ内容に揃えること。
          WORKER_MATCH_EXCLUDE_KEYWORDS: ${{ vars.WORKER_MATCH_EXCLUDE_KEYWORDS || 'BASE,楽天市場,楽天,保守,運用サポート,運営サポート,営業,ポスター,チラシ,名刺,バナー,パンフレット,冊子,ショップカード,動画,イラスト,漫画,マンガ,立ち絵,キャラクターデザイン,楽曲,音楽制作,撮影,画像加工,データ入力,商品リサーチ,創業メンバー,COO,ロゴ,バックオフィス,広告運用,戦略担当,セミナー,講座,カメラマン,CFO,資金繰り,管理会計,記事ライター,折衝経験,テレアポ,プレゼン資料,販促物,自動購入,出品アカウント,記事LP,ライター募集,新規顧客開拓,カスタマー対応,記帳代行,検索してくれる,お客様対応（窓口）,インスタ運用,Instagram運用,SNS運用,運用代行,クロージング担当,Canva,衣装,刺繍,ペンライト,教えるだけ,コンペ,アシスタントスタッフ,無料作成,ディレクション,アイデア出し,事務作業,出品代行,販売代行,CAPI設定,ビート制作,ぬいぐるみ,成果報酬,無報酬,無償,ボランティア,高収入,誰でも簡単,出演,女性の方,女性限定,モデル募集,キャスト募集,ライバー募集,チャットレディ,インフルエンサー,体験談,アンケート回答,アンケートに,声優,顔出し,記事作成,記事執筆,ブログ記事,講師募集,感想を書く,感想文,初心者向け,リサーチ作業,受注処理,メルマガ運用,メルマガ配信,メルマガの企画,メルマガ作成,アプリ開発,システム開発,Webシステム,コード解析,ディープラーニング,機械学習,AIエージェント,リストアップ,リスト作成,UTAGE,オペレーター募集,広告クリエイティブ,積み上が,デザイナーアシスタント,アシスタント募集,A+,メンバー募集,自由に働,空き時間,スキマ時間,すきま時間,隙間時間,ディレクター募集,時給,時間単価,ライティング初心者,ライティングスキル,成約報酬,商品画像制作,商品画像の制作,商品画像作成,yahoo,チャット対応,電話対応,メール対応,顧客対応,ebay,キャラクター制作,キャラクター作成,開発業務,DDD' }}
          # 2026-10-06、40,000円→25,000円に引き下げ（「もっと応募したい」との要望を
          # 受けて対象を広げる）。タイトルマッチのみで本文は見ないisExcludedと違い、
          # こちらは金額で機械的に切るだけなので、下げすぎると割に合わない案件まで
          # 通知が増える点は留意）。
          # 2026-10-08、25000→15000。評価0件のうちは大きい案件より小さい修正・LP案件の
          # 方が採用されやすく、最初の評価を取ることを優先する（手数料を引いても利益は残る）
          # 2026-10-08、15000→5000。返信が少ない（200件で3件）ため、評価0のうちは修正・更新などの
          # 小さい仕事で最初の評価を取る。小さい案件でもワーカーに渡す額が残るよう、利益の下限も3000→1000
          # 2026-10-09、5000→10000（ユーザー「1万円以上じゃなきゃダメ」）。まだ手を付けていない提案済みの1万円未満の案件も外す
          WORKER_MATCH_MIN_BUDGET_YEN: ${{ vars.WORKER_MATCH_MIN_BUDGET_YEN || '10000' }}
          WORKER_MATCH_MARGIN_PERCENT: ${{ vars.WORKER_MATCH_MARGIN_PERCENT || '20' }}
          WORKER_MATCH_MARGIN_MIN_YEN: ${{ vars.WORKER_MATCH_MARGIN_MIN_YEN || '1000' }}
          WORKER_MATCH_MARGIN_MAX_YEN: ${{ vars.WORKER_MATCH_MARGIN_MAX_YEN || '30000' }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ vars.JOB_WORKSHEET_NAME || '案件一覧' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.JOB_SCRAPER_DISCORD_WEBHOOK_URL }}
          # 1時間ごとの新着チェックの後は「候補なし」を送らない（毎時届くと埋もれるため）
          QUIET: ${{ (github.event.workflow_run.name == '新着チェック（1時間ごと・CrowdWorks）' || inputs.quiet == '1') && '1' || '0' }}
        run: python worker_match_main.py

      # ビューアが開いた時に最新版へ自動で移れるよう、dispatch-viewer の最新SHAをシートに書く（2026-10-09、viewer_version.py）。
      # マッチングとは関係ないので、失敗しても赤くしない
      - name: ビューアの最新版を記録
        continue-on-error: true
        working-directory: job_scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python viewer_version.py
