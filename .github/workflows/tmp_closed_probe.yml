name: 一時チェック（募集終了の判定）

# 2026-10-09、カテゴリ一覧から集めた案件の多くがすぐ「募集終了」になったため、本当に終わっているのか、
# 判定の言葉（募集は終了・契約済み など）が開いている案件にも出ていて誤判定しているのかを確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import re, time
          from playwright.sync_api import sync_playwright
          from src.crowdworks_scraper import CrowdWorksScraper
          sc = CrowdWorksScraper()
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              pg = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", locale="ja-JP").new_page()
              pg.set_default_timeout(5000)
              for base in ["https://crowdworks.jp/public/jobs/category/20?order=new&page=2",
                           "https://crowdworks.jp/public/jobs/search?search%5Bkeywords%5D=%E3%83%9B%E3%83%BC%E3%83%A0%E3%83%9A%E3%83%BC%E3%82%B8%E5%88%B6%E4%BD%9C&order=new&page=2"]:
                  for extra in ["", "&hide_expired=true"]:
                      url = base + extra
                      pg.goto(url, wait_until="domcontentloaded", timeout=30000)
                      try:
                          pg.wait_for_selector("a[href*='/public/jobs/']", timeout=10000)
                      except Exception:
                          pass
                      body = pg.locator("body").inner_text()
                      jobs = sc._extract_jobs(pg, "x", 60)
                      ids = sorted(int(j.url.rsplit("/", 1)[-1]) for j in jobs if j.url.rsplit("/", 1)[-1].isdigit())
                      closed_badges = body.count("募集終了")
                      print(f"::notice title={'カテゴリ20' if 'category' in base else 'キーワード'} {extra or '（そのまま）'}::{len(jobs)}件 ID {ids[0] if ids else '-'}〜{ids[-1] if ids else '-'}・ページ内の「募集終了」の字 {closed_badges}個・URL {pg.url[-60:]}")
                      time.sleep(2)
              b.close()
          EOF
