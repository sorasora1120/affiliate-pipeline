name: 一時チェック（募集終了の判定）

# 2026-10-09、カテゴリ一覧から集めた案件の多くがすぐ「募集終了」になったため、
# hide_expired=true で募集中だけになるか、カテゴリ一覧のどのリンクが案件一覧の本体かを確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import json, time
          from urllib.parse import quote
          from playwright.sync_api import sync_playwright
          JS = """() => {
            const out = [], seen = new Set();
            for (const a of document.querySelectorAll("a[href*='/public/jobs/']")) {
              const m = (a.getAttribute("href") || "").match(/\\/public\\/jobs\\/(\\d+)/);
              const t = (a.innerText || "").trim();
              if (!m || seen.has(m[1]) || t.length < 3) continue;
              seen.add(m[1]);
              const li = a.closest("li");
              const sur = li ? li.innerText : ((a.parentElement && a.parentElement.parentElement) ? a.parentElement.parentElement.innerText : t);
              const box = a.closest("main,section,aside,nav,footer,header,ul,ol");
              out.push({id: +m[1], title: t.slice(0, 40), sur: sur.slice(0, 400),
                        box: box ? box.tagName + "." + String(box.className || "").slice(0, 25) : "-"});
            }
            const heads = [...document.querySelectorAll("h1,h2,h3")].map(h => h.innerText.trim()).filter(Boolean).slice(0, 12);
            return {jobs: out, heads, labels: [...document.querySelectorAll("label")].map(l => l.innerText.trim()).filter(t => t.includes("募集")).slice(0, 5)};
          }"""
          cases = []
          for kw in ["ホームページ制作", "LP制作", "ペライチ"]:
              for extra in ["", "&hide_expired=true", "&hide_expired=true&page=2"]:
                  if kw != "ホームページ制作" and "page=2" in extra:
                      continue
                  cases.append((f"{kw}{'（隠す）' if 'hide' in extra else ''}{'2ページ目' if 'page=2' in extra else ''}",
                                f"https://crowdworks.jp/public/jobs/search?search%5Bkeywords%5D={quote(kw)}&order=new{extra}", kw))
          results = []
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              pg = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", locale="ja-JP").new_page()
              for name, url, label in cases:
                  pg.goto(url, wait_until="domcontentloaded", timeout=30000)
                  try:
                      pg.wait_for_selector("a[href*='/public/jobs/']", timeout=10000)
                  except Exception:
                      pass
                  if "403" in (pg.title() or ""):
                      raise SystemExit("403（このランナーはブロックされている）")
                  d = pg.evaluate(JS)
                  jobs = d["jobs"]
                  closed = sum("募集終了" in j["sur"] for j in jobs)
                  passed = sum(label in j["title"] or label in j["sur"] for j in jobs)
                  boxes = {}
                  for j in jobs:
                      boxes[j["box"]] = boxes.get(j["box"], 0) + 1
                  ids = sorted(j["id"] for j in jobs)
                  first = jobs[0]["sur"].replace("\n", "｜")[:300] if jobs else "-"
                  import re
                  dates = sorted(m.group(1) for j in jobs if (m := re.search(r"掲載日：\s*(\d{4}年\d{2}月\d{2}日)", j["sur"])))
                  few = sum(1 for j in jobs if (m := re.search(r"応募数\s*(\d+)\s*人", j["sur"])) and int(m.group(1)) <= 5)
                  results.append(f"{name}::{len(jobs)}件（うち募集終了 {closed}・今の絞り込みを通る {passed}・応募5人以下 {few}）ID {ids[0] if ids else '-'}〜{ids[-1] if ids else '-'}・"
                                 f"掲載日 {dates[0] if dates else '-'}〜{dates[-1] if dates else '-'}・入れ物 {json.dumps(boxes, ensure_ascii=False)}・ラベル {d['labels']}・"
                                 f"題名 {' / '.join(j['title'] for j in jobs[:8])}")
                  time.sleep(2)
              b.close()
          with open("probe.txt", "w") as f:
              f.write("\n".join(results) + "\n")
          EOF
      - name: 結果（前半）
        working-directory: job_scraper
        run: head -n 6 probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
      - name: 結果（後半）
        working-directory: job_scraper
        run: tail -n +7 probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
