name: 一時チェック（ココナラが読めるか）

# 2026-10-11、一時。ココナラの仕事依頼の一覧が GitHub Actions から読めるか、robots.txt と一緒に確かめる。確かめたら消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 見る
        working-directory: job_scraper
        run: python tmp_coconala_probe.py
