name: 一時チェック（ランサーズが読めるか）

# 2026-10-11、一時。ランサーズの一覧ページが GitHub Actions から読めるか確かめる。確かめたら消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && playwright install chromium --with-deps
      - name: 見る
        working-directory: job_scraper
        run: python tmp_lancers_probe.py
