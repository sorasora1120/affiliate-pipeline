name: 一時チェック（CrowdWorksの検索結果）

# 2026-10-09、収集が5時間で2件しか新着を拾っていないため、CrowdWorksの検索1ページ目に
# 何が出ているか・そのうちシートにまだ無い案件が何件あるかを確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import re
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              pg = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", locale="ja-JP").new_page()
              found = {}
              for url in ["https://crowdworks.jp/public/jobs?order=new", "https://crowdworks.jp/public/jobs/group/web_products", "https://crowdworks.jp/public/jobs/group/development"]:
                  try:
                      pg.goto(url, wait_until="domcontentloaded", timeout=30000)
                      pg.wait_for_timeout(2500)
                  except Exception as e:
                      print(f"::notice title=読み込み失敗::{url} {e}"); continue
                  print(f"::notice title=開いたページ::{url} → {pg.url} / {pg.title()}")
                  for a in pg.locator("a[href*='/public/jobs/category/']").all()[:400]:
                      href = a.get_attribute("href") or ""
                      m = re.search(r"/public/jobs/category/(\d+)", href)
                      if m:
                          t = (a.inner_text() or "").strip().replace("\n", " ")[:30]
                          found.setdefault(m.group(1), t)
              print("::notice title=カテゴリ一覧::" + " / ".join(f"{k}:{v}" for k, v in sorted(found.items(), key=lambda kv: int(kv[0]))))
              b.close()
          EOF
