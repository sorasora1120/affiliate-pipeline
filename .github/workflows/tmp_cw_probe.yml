name: 一時チェック（CrowdWorksの検索結果）

# 2026-10-09、収集が5時間で2件しか新着を拾っていないため、CrowdWorksの検索1ページ目に
# 何が出ているか・そのうちシートにまだ無い案件が何件あるかを確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.parse, urllib.request
          from playwright.sync_api import sync_playwright
          from src.crowdworks_scraper import CrowdWorksScraper
          SHEET = "1i2BtQulkchFt2dXxt9o6qLhdC7CXlBpv91EziyCp3o0"
          q = urllib.parse.urlencode({"tqx": "out:json", "sheet": "案件一覧", "tq": "select G"})
          text = urllib.request.urlopen(urllib.request.Request(f"https://docs.google.com/spreadsheets/d/{SHEET}/gviz/tq?{q}", headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode()
          data = json.loads(text[text.index("(") + 1:text.rindex(")")])
          known = {(r["c"][0] or {}).get("v") for r in data["table"]["rows"] if r.get("c")}
          scraper = CrowdWorksScraper()
          with sync_playwright() as pw:
              b = pw.chromium.launch(headless=True)
              pg = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36", locale="ja-JP").new_page()
              pg.set_default_timeout(5000)
              total_new = 0
              for cid, name in [(14, "ホームページ作成"), (15, "Webデザイン"), (16, "HTML・CSS"), (17, "LP"), (20, "WordPress"), (84, "EC制作"), (137, "ECデザイン"), (87, "スマホサイト")]:
                  url = f"https://crowdworks.jp/public/jobs/category/{cid}?order=new"
                  pg.goto(url, wait_until="domcontentloaded", timeout=30000)
                  try:
                      pg.wait_for_selector("a[href*='/public/jobs/']", timeout=10000)
                  except Exception:
                      pass
                  jobs = scraper._extract_jobs(pg, name, 50)
                  new = [j for j in jobs if j.url not in known]
                  total_new += len(new)
                  print(f"::notice title=カテゴリ{cid} {name}::1ページ目 {len(jobs)}件・シートに無い {len(new)}件 → " + " / ".join(j.title[:28] for j in new[:12]))
                  time.sleep(2)
              print(f"::notice title=合計::カテゴリの1ページ目だけで、シートに無い案件 {total_new}件")
              b.close()
          EOF
