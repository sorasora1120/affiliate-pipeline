name: TikTok台本自動生成（毎日）

on:
  schedule:
    # JST 8:00 に毎日実行（投稿準備を朝に）
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: TikTok台本を生成
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_DROPSHIP: ${{ secrets.DISCORD_WEBHOOK_DROPSHIP }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python -m dropshipping.tiktok.main

      - name: 生成した台本をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dropshipping/tiktok/scripts/ dropshipping/tiktok/topic_history.json
          git diff --staged --quiet || git commit -m "chore: TikTok台本自動生成 $(date +%Y-%m-%d)"
          git push

      - name: 失敗時にDiscordへ通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \":red_circle: TikTok台本生成が失敗しました。\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
