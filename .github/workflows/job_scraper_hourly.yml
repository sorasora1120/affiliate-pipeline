name: 新着チェック（1時間ごと・CrowdWorks）

# 2026-10-08追加。200件応募して返信3件だったため、募集が出てすぐ・応募者が少ないうちに
# 応募できるようにする。1日3回の通常収集（job_scraper.yml）とは別に、日中は1時間ごとに
# 各キーワードの1ページ目（新着）だけを見る。終わるとマッチング（worker_match.yml）が動き、
# 応募者が少ない新着は「🔥今すぐ応募」としてDiscordに1通で届く。
# 2026-10-09、自身の schedule（毎時23分）は GitHub 側でほとんど飛ばされていたのでやめ、
# collect_ticker.yml（10分ごとに起きて、直近50分に収集が無ければこれを動かす）から起動する。
# ワークフロー名は worker_match.yml の workflow_run とQUIETの判定で使っているので変えないこと。
on:
  workflow_dispatch:

# 通常収集と同じグループにして、同時に走って同じ新着を二重に書き込むのを防ぐ
concurrency:
  group: job-scraper-collect
  cancel-in-progress: false

jobs:
  try1:
    uses: ./.github/workflows/cw_collect_attempt.yml
    with: { pages: "1", quiet: "1" }
    secrets: inherit
  try2:
    needs: try1
    if: ${{ needs.try1.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    with: { pages: "1", quiet: "1" }
    secrets: inherit
  try3:
    needs: try2
    if: ${{ needs.try2.outputs.blocked == 'true' }}
    uses: ./.github/workflows/cw_collect_attempt.yml
    with: { pages: "1", quiet: "1" }
    secrets: inherit
  # collect_ticker.yml（github-actions[bot]）に起動された回は、終わっても worker_match.yml の workflow_run が
  # 起きない（2026-10-09確認：トークンで起きたイベントからは次のワークフローが動かない決まり）。その時だけここで起動する
  match:
    needs: [try1, try2, try3]
    if: ${{ always() && github.triggering_actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: マッチングを起動
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/worker_match.yml/dispatches" -f ref=main -f "inputs[quiet]=1"
