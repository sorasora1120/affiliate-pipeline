name: 一時チェック（外した案件の見直し）

# 2026-10-09、「案件を増やして」とのことで、10-07以降に外した案件を理由ごとに全部出し、
# 制作の仕事なのに落としているもの（関連判定・除外語の取りこぼし）が無いかを見る。確認後に消す。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-dotenv
      - name: 調べる
        working-directory: job_scraper
        run: |
          python3 - <<'EOF'
          import json, urllib.parse, urllib.request
          from collections import defaultdict
          import config
          from src.worker_matcher import is_relevant_title, title_has_excluded
          from src.budget_utils import parse_budget_yen
          sheet = "1i2BtQulkchFt2dXxt9o6qLhdC7CXlBpv91EziyCp3o0"
          tq = "select A,C,E where Q >= '2026-10-07' and (A = '対象外（除外キーワード）' or A = '対象外（要注意）' or A = '対象外（予算未達）')"
          q = urllib.parse.urlencode({"tqx": "out:json", "sheet": "案件一覧", "tq": tq})
          text = urllib.request.urlopen(urllib.request.Request(f"https://docs.google.com/spreadsheets/d/{sheet}/gviz/tq?{q}", headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read().decode()
          data = json.loads(text[text.index("(") + 1:text.rindex(")")])
          val = lambda c: "" if not c or c.get("v") is None else str(c.get("f") or c["v"])
          rows = [[val(c) for c in (r.get("c") or [])] for r in data["table"]["rows"]]
          seen = set()
          irrelevant, by_kw, flagged, cheap = [], defaultdict(list), [], []
          for status, title, budget in rows:
              if title in seen:
                  continue
              seen.add(title)
              t = title.replace("::", " ").replace("\n", " ")
              if status == "対象外（要注意）":
                  flagged.append(t[:40])
              elif status == "対象外（予算未達）":
                  cheap.append(f"{t[:30]}（{budget}）")
              else:
                  hits = [k for k in config.WORKER_MATCH_EXCLUDE_KEYWORDS if title_has_excluded(title, [k])]
                  if hits:
                      by_kw[hits[0]].append(t[:28])
                  elif not is_relevant_title(title):
                      irrelevant.append(t[:45])
          out = []
          for i in range(0, len(irrelevant), 35):
              out.append(f"関連なし{i // 35 + 1}::" + " / ".join(irrelevant[i:i + 35]))
          kw_lines = [f"{k}({len(v)}): {' | '.join(v[:3])}" for k, v in sorted(by_kw.items(), key=lambda kv: -len(kv[1]))]
          for i in range(0, len(kw_lines), 25):
              out.append(f"除外語{i // 25 + 1}::" + " / ".join(kw_lines[i:i + 25]))
          out.append("要注意::" + " / ".join(flagged[:60]))
          for i in range(0, len(cheap), 40):
              out.append(f"予算未達{i // 40 + 1}::" + " / ".join(cheap[i:i + 40]))
          out.insert(0, f"件数::関連なし {len(irrelevant)}・除外語 {sum(len(v) for v in by_kw.values())}・要注意 {len(flagged)}・予算未達 {len(cheap)}（題名の重複を除く）")
          open("probe.txt", "w").write("\n".join(out) + "\n")
          EOF
      - name: 結果1
        working-directory: job_scraper
        run: sed -n '1,9p' probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
      - name: 結果2
        working-directory: job_scraper
        run: sed -n '10,18p' probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
      - name: 結果3
        working-directory: job_scraper
        run: sed -n '19,27p' probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
      - name: 結果4
        working-directory: job_scraper
        run: sed -n '28,40p' probe.txt | while IFS= read -r line; do echo "::notice title=${line%%::*}::${line#*::}"; done
