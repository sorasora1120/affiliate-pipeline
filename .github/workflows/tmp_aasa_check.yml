name: 一時チェック（CrowdWorksアプリのリンク対応）

# 2026-10-09、「案件リンクがアプリでなくサイトで開いてしまう」との相談を受けて、
# CrowdWorksがiPhoneのユニバーサルリンク（リンクをアプリで開く仕組み）に対応しているかを確かめる。確認後に消す。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 確認
        run: |
          for u in https://crowdworks.jp/.well-known/apple-app-site-association https://crowdworks.jp/apple-app-site-association; do
            code=$(curl -s -m 20 -A "Mozilla/5.0" -o body.txt -w "%{http_code}" "$u")
            echo "::notice title=$u::HTTP $code $(head -c 1500 body.txt | tr '\n' ' ')"
          done
