name: ランサーズ取得テスト（調査用）

# ランサーズをGitHub Actionsから取得できるか確かめるための手動実行専用ワークフロー。
# シートやDiscordには書き込まない。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt
      - run: playwright install chromium --with-deps
      - working-directory: job_scraper
        run: python lancers_probe.py サイト制作
