name: CrowdWorks取得テスト（一時）
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - working-directory: job_scraper
        run: pip install -r requirements.txt && playwright install chromium --with-deps
      - name: curl
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
          for u in "https://crowdworks.jp/public/jobs/search?search%5Bkeywords%5D=%E3%82%B5%E3%82%A4%E3%83%88%E5%88%B6%E4%BD%9C&order=new" \
                   "https://crowdworks.jp/public/jobs/group/development" \
                   "https://crowdworks.jp/public/jobs/category/14" \
                   "https://crowdworks.jp/public/jobs.rss" \
                   "https://crowdworks.jp/public/jobs/category/14.rss" \
                   "https://crowdworks.jp/"; do
            echo "$u -> $(curl -s -o /tmp/o.html -w '%{http_code}' -A "$UA" -H 'Accept-Language: ja' "$u") size=$(wc -c </tmp/o.html) jobs=$(grep -o '/public/jobs/[0-9]*' /tmp/o.html | sort -u | wc -l)"
          done
      - name: playwright
        working-directory: job_scraper
        run: |
          python - <<'PY'
          import logging; logging.basicConfig(level=logging.INFO)
          from src.crowdworks_scraper import CrowdWorksScraper
          jobs = CrowdWorksScraper().fetch_jobs(["サイト制作"], max_per_keyword=40, interval_seconds=1, pages_per_keyword=1)
          print("COUNT", len(jobs))
          for j in jobs[:5]: print(j)
          PY
